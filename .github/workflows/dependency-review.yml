name: Dependency Review

on: pull_request

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          # minimatch < 11.0.1 (DoS via globparts amplification). The fix exists
          # only in 11.x and no ESLint, typescript-eslint, or TypeDoc release
          # depends on it yet. Dev tooling only; never published and it only
          # processes this repository's own glob patterns.
          # Remove once eslint, typescript-eslint, and typedoc require minimatch ^11.
          allow-ghsas: GHSA-g3hv-75wg-m249
