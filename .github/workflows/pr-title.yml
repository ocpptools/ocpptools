name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\([a-z0-9-]+(,[a-z0-9-]+)*\))?!?: .+'
          if ! printf '%s' "$PR_TITLE" | grep -qE "$pattern"; then
            echo "::error::Title must follow Conventional Commits, e.g. 'feat(core): parse CALLERROR details'."
            exit 1
          fi
