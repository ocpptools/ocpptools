name: Release

# Manual on purpose, so no merge to `main` can publish by accident. Run it once
# to open the "chore: version packages" pull request, merge that, and run it
# again to publish.
#
# Secrets in the `release` environment:
# - CHANGESETS_TOKEN: token that opens the version pull request. The organization
#   does not let GITHUB_TOKEN create pull requests, and pull requests it creates
#   do not trigger the required checks anyway.
# - NPM_TOKEN: temporary. npm trusted publishing needs the package to exist, so
#   the first publish uses a token. Remove it once the trusted publisher is set
#   up (owner ocpptools, repository ocpptools, workflow release.yml, environment
#   release).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'chore: version packages'
          # The DCO check requires a sign-off on every commit.
          commit-message: |-
            chore: version packages

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          github-token: ${{ secrets.CHANGESETS_TOKEN }}
          # Push with git so the bot is the commit author, which the DCO check
          # compares with the sign-off, and so release tags stay annotated.
          push-with-git-cli: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
