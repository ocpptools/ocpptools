name: Release

# Manual on purpose, so no merge to `main` can publish by accident. Run it once
# to open the "chore: version packages" pull request, merge that, and run it
# again to publish.
#
# Secrets in the `release` environment:
# - CHANGESETS_TOKEN: token that opens the version pull request. The organization
#   does not let GITHUB_TOKEN create pull requests, and pull requests it creates
#   do not trigger the required checks anyway.
# npm publishing uses the trusted publisher (owner ocpptools, repository
# ocpptools, workflow release.yml, environment release) with OIDC and
# provenance. The temporary NPM_TOKEN is no longer injected here; delete the
# secret in GitHub and revoke the token in npm if it still exists.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:testing-gate
      # CycloneDX for the production dependency graph. The npm tarball does not
      # include it because published versions are immutable; the workflow
      # artifact is the record for the release run.
      - name: Generate a CycloneDX SBOM per published package
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          for package in "@ocpptools/core" "@ocpptools/schema-utils" "@ocpptools/validator" "@ocpptools/simulator" "@ocpptools/builder" "@ocpptools/testing" "@ocpptools/schemas" "ocpptools"; do
            file=$(printf '%s' "$package" | tr '/@' '__')
            pnpm --filter "$package" sbom --sbom-format cyclonedx --sbom-spec-version 1.6 --prod --lockfile-only > "$RUNNER_TEMP/sbom/$file.cdx.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: ${{ runner.temp }}/sbom
          retention-days: 90
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'chore: version packages'
          # The DCO check requires a sign-off on every commit.
          commit-message: |-
            chore: version packages

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          github-token: ${{ secrets.CHANGESETS_TOKEN }}
          # Push with git so the bot is the commit author, which the DCO check
          # compares with the sign-off, and so release tags stay annotated.
          push-with-git-cli: true
        env:
          # pnpm 11 publishes by itself and reads `pnpm_config_*` variables. It
          # ignores `NPM_CONFIG_PROVENANCE`, so 0.1.0 of core went out without an
          # attestation. The name is case sensitive on Linux. Check a release
          # with `npm view <package>@<version> dist.attestations`.
          pnpm_config_provenance: 'true'
