name: Feature request
description: Propose a capability within the project scope.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Check the roadmap first. Hosted services, UI components, and OCPP
        schema distribution are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
