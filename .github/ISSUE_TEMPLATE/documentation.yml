name: Documentation
description: Report missing, wrong, or unclear documentation.
labels: [documentation, needs-triage]
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      description: A link or a path, for example packages/validator/README.md.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing, wrong, or unclear?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
